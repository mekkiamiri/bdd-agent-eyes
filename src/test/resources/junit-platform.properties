# Cucumber est lancé par la suite JUnit (RunCucumberTest), pas directement comme moteur racine.
cucumber.junit-platform.discovery.as-root-engine=false
cucumber.glue=io.github.mekkiamiri.bddagent
cucumber.plugin=pretty
# Par défaut, la référence ne joue que les scénarios dont la vérité terrain est « passe ».
# Pour jouer les pièges : mvn verify -Dcucumber.filter.tags="not @attendu:passe" (échecs attendus).
cucumber.filter.tags=@attendu:passe
